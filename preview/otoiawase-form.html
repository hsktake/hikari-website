<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜カットハウスひかり</title>
<meta name="description" content="カットハウスひかりへのご質問・ご意見・ご要望を受け付けております。">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!--
  カットハウスひかり お問い合わせフォーム（このファイル1つで動きます）
  ・送信した内容は、裏で Google（HSK-VOICE お問い合わせフォーム）に送られ、HSK-VOICE に自動で入ります。
  ・このファイルには、パスワードやお客様の情報は入っていません。
  ・どこから来たか（受付媒体）は自動で記録します。リンクの最後に ?from=受付媒体 を付けると、その名前で記録します。
-->
<style>
:root{--ink:#222;--sub:#666;--line:#d5d8dc;--bg:#f5f6f7;--accent:#e46c0a;--accent-d:#c35a05;--ng:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.8;-webkit-text-size-adjust:100%}
header{background:#fff;border-bottom:1px solid var(--line)}
header .in{max-width:680px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
header a{color:var(--accent);font-weight:700;font-size:17px;text-decoration:none;letter-spacing:.04em}
header a.home{color:var(--sub);font-weight:400;font-size:13px}
main{max-width:680px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:22px;font-weight:700;margin:0 0 12px;letter-spacing:.04em}
.lead{color:var(--sub);font-size:14px;margin:0 0 24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px 20px}
.f{margin:0 0 22px}
.f>label,.f>.t{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.req,.opt{font-size:11px;font-weight:700;margin-left:8px;padding:1px 6px;border-radius:3px;vertical-align:1px}
.req{color:#fff;background:var(--ng)}
.opt{color:var(--sub);border:1px solid var(--line)}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:11px 12px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:160px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,108,10,.15)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex:1 1 calc(50% - 8px);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:4px;padding:10px 6px;font-size:14px;background:#fff}
.seg input:checked+span{border-color:var(--accent);color:var(--accent-d);background:#fff6ee;font-weight:700}
.seg.pref label.full{flex:1 1 100%}
.dt{display:flex;gap:8px}.dt input{flex:1.25;min-width:0}.dt select{flex:1;min-width:0}
.sw{margin-top:10px}
.seg input:focus-visible+span{box-shadow:0 0 0 3px rgba(228,108,10,.25)}
.addph{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:9px 16px;font-size:14px;color:var(--ink);background:#fff;cursor:pointer}
.addph input{display:none}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph:empty{display:none}
.ph div{position:relative;width:80px;height:80px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#eee}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.err{display:none;color:var(--ng);font-size:13px;margin:4px 0 0}
.f.bad .err{display:block}
.f.bad input,.f.bad select,.f.bad textarea,.f.bad .seg span{border-color:var(--ng)}
.note{font-size:12.5px;color:var(--sub);margin:4px 0 0}
.agree{font-size:13px;color:var(--sub);margin:4px 0 16px}
.agree a{color:var(--ink)}
.send{display:block;width:100%;font:inherit;font-size:16px;font-weight:700;letter-spacing:.1em;color:#fff;background:var(--accent);border:0;border-radius:4px;padding:15px;cursor:pointer}
.send:hover{background:var(--accent-d)}
.send[disabled]{opacity:.6;cursor:wait}
.msg{display:none;background:#fdecea;color:var(--ng);border-radius:4px;padding:10px 12px;font-size:14px;margin:0 0 16px}
.msg.on{display:block}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tel{margin-top:20px;font-size:13.5px;color:var(--sub)}
.tel a{color:var(--ink);font-weight:700;text-decoration:none}
.done{text-align:center;padding:24px 0}
.done h2{font-size:19px;margin:0 0 10px}
footer{text-align:center;font-size:12px;color:var(--sub);padding:0 16px 24px}
</style>
</head>
<body>
<header><div class="in"><a href="https://www.cut-hikari.com/">カットハウスひかり</a></div></header>
<main>
<h1>お問い合わせ</h1>
<p class="lead">ご質問・ご意見・ご要望を受け付けております。内容を確認のうえ、担当者よりメールにてご連絡いたします。</p>
<div class="panel" id="app">
  <div class="msg" id="msg"></div>
  <div class="f" id="q-name"><label for="f-name">お名前<span class="req">必須</span></label><input type="text" id="f-name" autocomplete="name" maxlength="60"><p class="err"></p></div>
  <div class="f" id="q-mail"><label for="f-mail">メールアドレス<span class="req">必須</span></label><input type="email" id="f-mail" autocomplete="email" inputmode="email" maxlength="120"><p class="err"></p></div>
  <div class="f" id="q-body"><label for="f-body">お問い合わせ内容<span class="req">必須</span></label><textarea id="f-body" maxlength="4000"></textarea><p class="err"></p></div>
  <div class="f" id="q-date"><span class="t">ご利用日時<span class="opt">任意</span></span><div class="dt"><input type="date" id="f-date" aria-label="ご利用日"><select id="f-time" aria-label="ご利用の時間帯"></select></div><p class="err"></p></div>
  <div class="f" id="q-store"><span class="t">ご利用店舗<span class="req">必須</span></span><div class="seg pref" id="prefs"></div><div class="sw" id="storeWrap" hidden><select id="f-store" aria-label="ご利用店舗"></select></div><p class="err"></p></div>
  <div class="f" id="q-photo"><span class="t">写真<span class="opt">任意</span></span><label class="addph">写真を添付する（5枚まで）<input type="file" id="f-photo" accept="image/*" multiple></label><div class="ph" id="ph"></div><p class="err"></p></div>
  <div class="hp" aria-hidden="true"><input type="text" id="f-hp" tabindex="-1" autocomplete="off"></div>
  <p class="agree">ご入力いただいた個人情報は、<a href="https://www.cut-hikari.com/privacypolicy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に基づき適切に取り扱います。</p>
  <button type="button" class="send" id="send">送信する</button>
</div>
</main>
<footer>&copy; 1997 H.S.K</footer>
<script>
(function(){
"use strict";
// 送り先（Google Apps Script「HSK-VOICE お問い合わせフォーム」）
var API="https://script.google.com/macros/s/AKfycbywBFsL93X_skOM0SAuYSO5EVmUQHwZ8y4JA6OBlz39qTkMBdTS47n2j-HsTUA71Rvbcw/exec";
// 時間帯と店舗（Googleフォームと同じ。開いたあと、最新の一覧を裏で読み込んで入れ替えます）
var L={times:["9時台","10時台","11時台","12時台","13時台","14時台","15時台","16時台","17時台","18時台","19時台","20時台","わからない"],prefs:[
{label:"茨城県",stores:["青葉店","アクロスモール守谷店","麻生店","鮎川店","荒川本郷店","石岡中央店","石下店","稲敷パルナ店","稲敷パンプ店","岩井店","大津港店","鹿嶋東店","カットスペースPLUS","上水戸店","川尻店","サプラ龍ヶ崎店","下妻店","大子店","高場店","高萩店","つくば梅園店","つくば高見原店","友部店","羽鳥店","常陸太田店","藤代駅南口店","鉾田SC店","真壁店","水海道淵頭店","水戸赤塚店","水戸エクセル店","みらい平店"]},
{label:"栃木県",stores:["今市店","氏家オータニ店","大金店","小山城東店","鹿沼栄町店","上三川店","さくらベイシア店","自治医大店","鶴田店","西方店","二宮店","野沢店","HAIR STUDIO MR.COOL","ベイシア壬生店","御幸ヶ原店","Men's Cut & Self DELIGHT","真岡荒町店"]},
{label:"千葉県",stores:["旭店","芦崎店","小見川店","酒々井店","シャンプーカット アルファ","ちはら台店","天王台店","PIACITY八街店","四街道店"]},
{label:"福島県",stores:["いわき泉店","いわき錦町店","ベイシアモール白河店","矢吹店"]},
{label:"店舗を利用していない・わからない",stores:[]}]};
var MAX=5,PH=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

// どこから来たか（お客様は何も選ばない）
var FROM=(function(){
 var f="";try{f=new URLSearchParams(location.search).get("from")||""}catch(e){}
 f=f.replace(/[<>"'&\\]/g,"").trim().slice(0,40);if(f)return f;
 var ua=navigator.userAgent||"",ref="";try{ref=document.referrer?new URL(document.referrer).hostname.toLowerCase():""}catch(e){}
 if(/instagram\.com$/.test(ref)||/Instagram/.test(ua))return "Instagram";
 if(/(^|\.)line\.me$|(^|\.)line-apps\.com$/.test(ref)||/ Line\//.test(ua))return "LINE";
 if(/(^|\.)google\.[a-z.]+$|(^|\.)yahoo\.co\.jp$|(^|\.)yahoo\.com$|(^|\.)bing\.com$|duckduckgo\.com$/.test(ref))return "検索";
 if(ref&&(ref===location.hostname.toLowerCase()||/(^|\.)cut-hikari\.com$/.test(ref))){
  var sp=/iPhone|iPad|iPod|Android|Mobile/i.test(ua)||(window.matchMedia&&matchMedia("(max-width: 768px)").matches);
  return sp?"メール（スマホHP）":"メール（パソコンHP）";
 }
 return "お問い合わせフォーム";
})();

function drawTimes(){var cur=$("f-time").value;$("f-time").innerHTML='<option value="">時間帯</option>'+L.times.map(function(t){return '<option>'+esc(t)+'</option>'}).join("");$("f-time").value=cur}
// ご利用店舗：いちばん上に「利用していない・わからない」、次に県。県を押すと、その県の店舗だけが出る
function prefList(){var none=L.prefs.filter(function(p){return !p.stores.length}),rest=L.prefs.filter(function(p){return p.stores.length});return none.concat(rest)}
function prefOf(){var r=document.querySelector('input[name=pref]:checked');return r?prefList()[+r.value]:null}
function drawPrefs(){
 var cur=prefOf(),curStore=$("f-store").value;
 $("prefs").innerHTML=prefList().map(function(p,i){return '<label'+(p.stores.length?'':' class="full"')+'><input type="radio" name="pref" value="'+i+'"'+(cur&&cur.label===p.label?' checked':'')+'><span>'+esc(p.stores.length?p.label:"利用していない・わからない")+'</span></label>'}).join("");
 drawStores(curStore);
}
function drawStores(keep){
 var p=prefOf(),w=$("storeWrap");
 if(!p||!p.stores.length){w.hidden=true;$("f-store").innerHTML="";return}
 $("f-store").innerHTML='<option value="">店舗を選択してください（'+esc(p.label)+'）</option>'+p.stores.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>'}).join("");
 if(keep)$("f-store").value=keep;w.hidden=false;
}
$("prefs").addEventListener("change",function(){drawStores("")});
drawTimes();drawPrefs();
// 最新の店舗一覧を裏で読み込む（読めなくても、上の一覧でそのまま送れる）
try{fetch(API+"?api=layout").then(function(r){return r.json()}).then(function(x){
 if(!x||!x.ok||!x.layout)return;var y=x.layout;
 if(y.q&&y.q.time&&y.q.time.opts&&y.q.time.opts.length){L.times=y.q.time.opts;drawTimes()}
 if(y.prefs&&y.prefs.length){var keep=$("f-store").value,cur=prefOf();L.prefs=y.prefs.map(function(p){return{label:p.label,stores:p.stores||[]}});
  $("prefs").innerHTML="";drawPrefs();if(cur){var i=prefList().map(function(p){return p.label}).indexOf(cur.label);if(i>=0){document.querySelectorAll('input[name=pref]')[i].checked=true;drawStores(keep)}}}
}).catch(function(){})}catch(e){}

function bad(id,m){var e=$("q-"+id);e.classList.add("bad");e.querySelector(".err").textContent=m}
function ok(id){var e=$("q-"+id);if(e)e.classList.remove("bad")}
$("app").addEventListener("input",function(e){var q=e.target.closest(".f");if(q&&q.id!=="q-photo")q.classList.remove("bad")});
$("app").addEventListener("change",function(e){var q=e.target.closest(".f");if(q&&q.id!=="q-photo")q.classList.remove("bad")});

// 写真：画面で縮めてから送る
$("f-photo").addEventListener("change",function(e){
 var files=[].slice.call(e.target.files||[]);e.target.value="";ok("photo");
 files.forEach(function(f){
  if(PH.length>=MAX){bad("photo","写真は"+MAX+"枚までです");return}
  if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)){bad("photo","画像のファイルを選んでください");return}
  var slot={data:""};PH.push(slot);drawPh();
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){var m=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,m/Math.max(w,h)),c=document.createElement("canvas");
   c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);slot.data=c.toDataURL("image/jpeg",0.82);drawPh()};
  img.onerror=function(){URL.revokeObjectURL(u);PH.splice(PH.indexOf(slot),1);drawPh();bad("photo","この写真は読み込めませんでした。別の写真をお試しください")};
  img.src=u;
 });
});
function drawPh(){
 $("ph").innerHTML=PH.map(function(p,i){return '<div>'+(p.data?'<img src="'+p.data+'" alt="">':'')+'<button type="button" data-i="'+i+'" aria-label="この写真を外す">×</button></div>'}).join("");
 [].forEach.call($("ph").querySelectorAll("button"),function(b){b.onclick=function(){PH.splice(+b.getAttribute("data-i"),1);drawPh()}});
}

$("send").addEventListener("click",function(){
 var v=function(id){return String($("f-"+id).value||"").trim()},p=prefOf();
 var d={name:v("name"),mail:v("mail"),kind:"",pref:p?p.label:"",store:p&&p.stores.length?v("store"):"",body:v("body"),date:v("date"),time:v("time"),hp:v("hp"),from:FROM,
  photos:PH.filter(function(x){return x.data}).map(function(x){return{type:"image/jpeg",data:x.data}})};
 ["name","mail","store","body","photo"].forEach(ok);
 var first=null,need=function(c,id,m){if(!c){bad(id,m);first=first||id}};
 need(d.name,"name","お名前を入力してください");
 need(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.mail),"mail","メールアドレスを正しく入力してください");
 need(d.body,"body","お問い合わせ内容を入力してください");
 need(d.pref,"store","ご利用店舗を選択してください");
 if(p&&p.stores.length)need(d.store,"store","店舗を選択してください");
 if(PH.some(function(x){return !x.data})){bad("photo","写真を読み込み中です。少し待ってから送信してください");first=first||"photo"}
 if(first){$("q-"+first).scrollIntoView({behavior:"smooth",block:"center"});return}
 var b=$("send"),m=$("msg");b.disabled=true;b.textContent="送信しています…";m.className="msg";
 var again=function(t){b.disabled=false;b.textContent="送信する";m.className="msg on";m.textContent=(t||"送信できませんでした")+"。お手数ですが、もう一度お試しください。";m.scrollIntoView({behavior:"smooth",block:"center"})};
 fetch(API,{method:"POST",body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(x){
  if(!x||!x.ok)return again(x&&x.error);
  $("app").innerHTML='<div class="done"><h2>送信が完了しました</h2><p>お問い合わせいただき、ありがとうございます。<br>内容を確認のうえ、担当者よりメールにてご連絡いたします。</p><p class="note">内容によっては、ご連絡までにお時間をいただく場合がございます。</p></div>';
  window.scrollTo(0,0);
 }).catch(function(){again()});
});
})();
</script>
</body>
</html>
