<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜カットハウスひかり</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--orange:#EF7A00;--orange-deep:#C96400;--orange-soft:#FFE6C7;--sun:#FFC94D;--brown:#4A2E1A;--brown-soft:#7D5E48;--cream:#FFFAF2;--line:#F1DEC6}
*{box-sizing:border-box}
body{margin:0;background:#FFF8EE;color:var(--brown);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.8}
.top{background:#fff;border-bottom:4px solid var(--orange)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top a.logo{color:var(--orange);font-weight:800;font-size:20px;text-decoration:none;letter-spacing:.04em}
.top a.home{color:var(--brown);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:6px 0 14px;padding-left:12px;border-left:6px solid var(--orange)}
.legal-card{background:#fff;border-radius:18px;padding:22px 18px 24px;box-shadow:0 4px 0 rgba(74,46,26,.08);margin-bottom:18px}
.legal-card h2{font-size:16px;margin:0 0 8px}
.legal-card a{color:var(--orange-deep);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:999px;border:0;font:inherit;font-size:16px;font-weight:800;letter-spacing:.06em;cursor:pointer}
.btn-main{background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-deep)}
.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-deep)}
.other{font-size:14px}
.other p{margin:4px 0}
.other .tel{font-size:20px;font-weight:800;color:var(--orange-deep);text-decoration:none}
footer{text-align:center;font-size:12px;color:var(--brown-soft);padding:16px}

/* お問い合わせフォーム（contact.html だけで読み込む） */
.cf-card { margin-bottom: 22px; }
.cf-lead { font-size: 14px; color: var(--brown-soft); margin: 0 0 18px; }
.cf-load { text-align: center; color: var(--brown-soft); padding: 26px 0; font-size: 14px; }
.cf-load .cf-spin { margin: 0 auto 10px; display: block; }
.cf-q { margin-bottom: 22px; }
.cf-t { display: block; font-weight: 800; font-size: 16px; margin-bottom: 4px; color: var(--brown); }
.cf-req, .cf-opt { display: inline-block; margin-left: 8px; font-size: 11px; border-radius: 6px; padding: 0 7px; line-height: 20px; vertical-align: 2px; font-weight: 700; }
.cf-req { color: #fff; background: #D9480F; }
.cf-opt { color: var(--brown-soft); border: 1px solid var(--line); }
.cf-help { font-size: 13px; color: var(--brown-soft); margin: 0 0 8px; line-height: 1.7; }
.legal-card .cf-help + * { margin-top: 0; }
.cf input[type=text], .cf input[type=email], .cf input[type=tel], .cf input[type=date], .cf select, .cf textarea {
  width: 100%; font: inherit; font-size: 16px; font-weight: 500; color: var(--brown); background: var(--cream);
  border: 2px solid var(--line); border-radius: 14px; padding: 11px 14px; appearance: none; -webkit-appearance: none;
}
.cf select { background-image: linear-gradient(45deg, transparent 50%, var(--orange) 50%), linear-gradient(135deg, var(--orange) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 38px; }
.cf textarea { min-height: 160px; resize: vertical; line-height: 1.7; }
.cf input:focus, .cf select:focus, .cf textarea:focus { outline: none; border-color: var(--orange); background-color: #fff; }
.cf-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cf-chips label { cursor: pointer; }
.cf-chips input { position: absolute; opacity: 0; pointer-events: none; }
.cf-chips span { display: inline-block; border: 2px solid var(--line); background: var(--cream); border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: 15px; color: var(--brown); }
.cf-chips input:checked + span { border-color: var(--orange); background: var(--orange); color: #fff; }
.cf-chips input:focus-visible + span { outline: 3px solid var(--sun); outline-offset: 2px; }
.cf-addph { display: inline-flex; align-items: center; gap: 8px; border: 2px dashed var(--orange); color: var(--orange-deep); background: var(--orange-soft); border-radius: 14px; padding: 11px 18px; font-weight: 800; cursor: pointer; }
.cf-addph svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.cf-addph input { display: none; }
.cf-ph { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.cf-ph:empty { display: none; }
.cf-ph div { position: relative; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); background: var(--cream); display: flex; align-items: center; justify-content: center; }
.cf-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cf-ph button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(74, 46, 26, .75); color: #fff; font-size: 15px; line-height: 26px; padding: 0; cursor: pointer; }
.cf-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--orange-soft); border-top-color: var(--orange); animation: cf-spin .8s linear infinite; }
@keyframes cf-spin { to { transform: rotate(360deg); } }
.cf-more { border-top: 2px dashed var(--line); padding-top: 18px; margin-top: 6px; }
.cf-sub { font-size: 13px; color: var(--brown-soft); margin: 0 0 14px; }
.cf-err { color: #D9480F; font-size: 13px; font-weight: 700; margin: 6px 0 0; display: none; }
.cf-q.bad .cf-err { display: block; }
.cf-q.bad input, .cf-q.bad select, .cf-q.bad textarea, .cf-q.bad .cf-chips span { border-color: #D9480F; }
.cf-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.cf-agree { font-size: 13px; color: var(--brown-soft); text-align: center; margin: 4px 0 14px; }
.cf-send { width: 100%; font-size: 17px; }
.cf-send[disabled] { opacity: .6; cursor: wait; }
.cf-msg { display: none; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
.cf-msg.ng { display: block; background: #FDECE4; color: #B23A0B; }
.cf-done { text-align: center; padding: 18px 0 8px; }
.cf-done-ttl { font-size: 22px; font-weight: 800; color: var(--orange-deep); margin: 0 0 10px; }
@media (max-width: 600px) { .cf-ph div { width: 30%; height: auto; aspect-ratio: 1; } }
@media (prefers-reduced-motion: reduce) { .cf-spin { animation-duration: 2s; } }

.steps{display:flex;gap:6px;margin:0 0 16px;padding:0;list-style:none;font-size:12px;font-weight:700}
.steps li{flex:1;text-align:center;background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:6px 4px;color:var(--brown-soft)}
.steps li.on{border-color:var(--orange);color:var(--orange-deep);background:#fff}
.steps b{display:block;font-size:16px}
.cf-send svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.after{font-size:13px;color:var(--brown-soft);background:var(--cream);border-radius:12px;padding:10px 14px;margin:14px 0 0}
.after b{color:var(--brown)}
.cf-send.off{opacity:.5}
a.cf-send{text-decoration:none;color:#fff}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="https://www.cut-hikari.com/">カットハウスひかり</a><a class="home" href="https://www.cut-hikari.com/">ホームに戻る</a></div></header>
<main>
  <h1>お問い合わせ・ご意見等</h1>
  <section class="legal-card cf-card">
    <ol class="steps"><li class="on"><b>1</b>店舗を選ぶ</li><li><b>2</b>メールが開く</li><li><b>3</b>内容を書いて送信</li></ol>
    <div class="cf" id="cf" data-api="https://script.google.com/macros/s/AKfycbywBFsL93X_skOM0SAuYSO5EVmUQHwZ8y4JA6OBlz39qTkMBdTS47n2j-HsTUA71Rvbcw/exec"><p class="cf-load"><span class="cf-spin"></span>読み込んでいます…</p></div>
  </section>
  <section class="legal-card other">
    <h2>お電話でのお問い合わせ</h2>
    <p><a class="tel" href="tel:05017205983">050-1720-5983</a></p>
    <p>（音声ガイダンスが流れます）</p>
  </section>
</main>
<footer>(C)1997 H.S.K, All Rights Reserved.</footer>
<script>
(function(){
 "use strict";
 var box=document.getElementById("cf"),API=box.getAttribute("data-api"),TO="info@cut-hikari.com",L=null;
 function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
 function $(i){return document.getElementById(i)}
 function sel(id,opts){return '<select id="f-'+id+'"><option value="">選択してください</option>'+opts.map(function(o){return '<option>'+esc(o)+'</option>'}).join("")+'</select>'}
 function q(id,t,help,inner){return '<div class="cf-q" id="q-'+id+'"><label class="cf-t" for="f-'+id+'">'+esc(t)+'<span class="cf-req">必須</span></label>'+(help?'<p class="cf-help">'+esc(help)+'</p>':'')+inner+'<p class="cf-err" role="alert"></p></div>'}
 function fail(){box.innerHTML='<p class="cf-load">読み込めませんでした。お手数ですが、<a href="mailto:'+TO+'">'+TO+'</a> 宛てにメールでお送りください。</p>'}
 fetch(API+"?api=layout").then(function(r){return r.json()}).then(function(x){if(!x||!x.ok)return fail();L=x.layout;render()}).catch(fail);
 function render(){
  var h=q("kind","お問い合わせの種類","",'<div class="cf-chips">'+L.q.kind.opts.map(function(o){return '<label><input type="radio" name="kind" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>'}).join("")+'</div>');
  h+=q("pref","ご利用の店舗がある県","ご利用になった（またはご利用予定の）店舗の県をお選びください。",sel("pref",L.prefs.map(function(p){return p.label})));
  h+='<div id="cf-store"></div>';
  h+='<a class="btn btn-main cf-send" id="cf-send" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>メールを作成する</a>';
  h+='<p class="after">押すと、お使いのメールアプリが開きます。<br><b>宛先・件名は入力済み</b>です。本文にお問い合わせ内容を書いて、写真があれば添付して送信してください。</p>';
  box.innerHTML=h;
  $("f-pref").onchange=function(){var p=pref();$("cf-store").innerHTML=p&&p.stores.length?q("store","ご利用店舗（"+p.label+"）","一覧からお選びください。",sel("store",p.stores)):"";};
  box.addEventListener("change",function(e){var x=e.target.closest(".cf-q");if(x)x.classList.remove("bad")});
  $("cf-send").onclick=go;
 }
 function pref(){var v=$("f-pref").value;return L.prefs.filter(function(p){return p.label===v})[0]}
 function bad(id,m){var e=$("q-"+id);e.classList.add("bad");e.querySelector(".cf-err").textContent=m}
 function go(e){
  e.preventDefault();
  var k=document.querySelector('input[name=kind]:checked'),p=pref(),s=$("f-store"),first=null;
  if(!k){bad("kind","お問い合わせの種類を選んでください");first=first||"kind"}
  if(!p){bad("pref","県を選んでください");first=first||"pref"}
  else if(p.stores.length&&!(s&&s.value)){bad("store","ご利用店舗を選んでください");first=first||"store"}
  if(first){$("q-"+first).scrollIntoView({behavior:"smooth",block:"center"});return}
  var store=p.stores.length?s.value:"店舗指定なし";
  var subject="【お問い合わせ】"+store+"／"+k.value;
  var body="（ここにお問い合わせ内容をお書きください。写真がある場合は、このメールに添付してください）\n\n\n\n――――――――――\nご利用店舗："+store+"\nお問い合わせの種類："+k.value+"\nお名前：\nご利用日（わかれば）：\n――――――――――\n※件名は変えずにお送りください。";
  location.href="mailto:"+TO+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
 }
})();
</script>
</body>
</html>
