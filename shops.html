<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <p class="en">Shop list</p>
      <h1>店舗一覧</h1>
      <p>茨城・栃木・千葉・福島に62店舗。お近くの店舗をお探しください。</p>

      <div class="tabs" role="group" aria-label="エリアで絞り込む" id="tabs"></div>
      <div class="filters">
        <label><input type="checkbox" id="f-care">ヒゲ脱毛・光フェイシャルがある店舗</label>
        <label><input type="checkbox" id="f-open">定休日なしの店舗</label>
      </div>
    </div>

    <p class="result-count" aria-live="polite" id="count"></p>
    <div id="list"></div>

    <p class="test-note">※試作版のため、店舗情報は現行サイトから読み込んだものです。最新の営業状況は各店舗ページでご確認ください。</p>
