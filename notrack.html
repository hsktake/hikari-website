<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>この端末の計測設定（社内用）｜カットハウスひかり</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#EF7A00">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="go.css?v=3">
<script src="notrack.js?v=1" defer></script>
</head>
<body>
<!-- 社内用：この端末（ブラウザ）からの閲覧をアクセス集計（HSK-COUNT）でどう扱うかを選ぶ（notrack.js。localStorage hk_notrack） -->
<main class="nt">
  <img class="go-logo" src="assets/logo-hikari.webp" alt="カットハウスひかり" width="178" height="109">
  <h1>この端末の計測設定<small>社内用</small></h1>
  <p class="nt-now" id="ntNow">読み込んでいます…</p>
  <div class="nt-opts" role="radiogroup" aria-label="計測のしかた">
    <button type="button" class="nt-opt" role="radio" data-v="off" aria-checked="false">
      <span class="nt-ic">🚫</span><b>数えない</b><span>ふだんの社内の閲覧。アクセス集計に入りません</span>
    </button>
    <button type="button" class="nt-opt test" role="radio" data-v="test" aria-checked="false">
      <span class="nt-ic">🧪</span><b>テストで数える</b><span>QR・リンクの動作確認用。ふだんの数字には入らず、HSK-COUNT の「テスト」に出ます</span>
    </button>
    <button type="button" class="nt-opt on" role="radio" data-v="on" aria-checked="false">
      <span class="nt-ic">👥</span><b>お客様と同じに数える</b><span>社外の人の端末はこの状態です</span>
    </button>
  </div>
  <p class="nt-note">この設定は、この端末のこのブラウザだけに効きます（ほかのブラウザ・アプリ内のブラウザは別）。</p>
  <p class="go-home"><a href="./">トップページへ</a></p>
</main>
</body>
</html>
