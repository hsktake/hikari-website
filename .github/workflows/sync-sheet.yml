# ホームページ管理シートの内容を、ページ本体（HTML）にも書き込む（検索ロボット向け）。
# お客様の画面は main.js がその場でシートを読むので、こちらは1日数回で十分。
name: 管理シートをページに反映

on:
  schedule:
    # 日本時間 6:05・12:05・18:05（GitHub の時刻は UTC）
    - cron: "5 21 * * *"
    - cron: "5 3 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-sheet.yml"
      - "tools/sync_sheet.py"

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: シートを読んでページに反映
        env:
          TZ: Asia/Tokyo
        run: python3 tools/sync_sheet.py
      - name: 変わっていれば保存して公開
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "hikari-sheet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "管理シートの内容をページに反映（自動）"
          git push
          # GitHub Pages の公開を始める（自動で始まらないとき用）
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
